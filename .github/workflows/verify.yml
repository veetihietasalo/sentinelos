name: Verify (Miri + Kani)

# Dynamic verification of the unsafe HAL/TCB, kept SEPARATE from Kernel CI so the
# nightly-only Miri toolchain never touches the stable kernel build. Miri runs the
# hal unit tests under an interpreter that catches undefined behaviour
# (out-of-bounds/misaligned pointer use, use-after-free, data races).
#
# Kani proof harnesses live in-tree (`#[cfg(kani)]` in hal's cpuid.rs / ata.rs /
# simd.rs / apic.rs, and kernel's ml.rs / sched/mod.rs) and run in two jobs below:
# `kani-hal` (promoted 2026-07-24) and `kani-kernel` (promoted 2026-07-26). Both
# now GATE — as of 2026-07-26 every job in this workflow blocks merge on failure,
# and none carries `continue-on-error`. Each job's comment records the evidence
# its promotion rested on; read it before adding a harness to either.
on:
  # Scoped to main: an unscoped `push:` also fires on PR branches, duplicating
  # every PR's run (the `push` and `pull_request` events have different
  # `github.ref` values, so the concurrency group below does not dedupe them).
  push:
    branches: [main]
    paths:
      - "kernel/**"
      - ".github/workflows/verify.yml"
  pull_request:
    paths:
      - "kernel/**"
      - ".github/workflows/verify.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  miri:
    name: Miri (hal UB check)
    runs-on: ubuntu-latest
    # ~2 min in practice. Miri interprets rather than executes, so a pathological
    # test does not crash — it crawls. Capped for the same reason every other job
    # in this repo is: GitHub's default is 6 HOURS (see the Kani job's 5 h 38 min
    # / 5 h 41 min silent burns, 2026-07-24).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly + miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      # `cargo +nightly` is REQUIRED: kernel/rust-toolchain.toml pins the channel
      # to stable (which has no miri component), and rust-toolchain.toml wins over
      # the default toolchain; the explicit +nightly overrides it for this command.
      # `--target x86_64-unknown-linux-gnu` overrides the bare-metal build.target so
      # Miri runs the host tests. `-Zmiri-disable-isolation` only keeps Miri from
      # blocking incidental host calls; the hal tests are pure logic.
      - name: cargo +nightly miri test -p hal
        working-directory: kernel
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        run: cargo +nightly miri test -p hal --target x86_64-unknown-linux-gnu

      # `kernel`'s full host test suite (fs/wm/app + 16MiB-image-scale loops) is
      # prohibitively slow under Miri's interpreter, so we scope this to `ml::` —
      # the int8-quantised GEMM/MLP arithmetic that most benefits from Miri's
      # UB/pointer-provenance checking. Do not widen this to the whole suite.
      - name: "cargo +nightly miri test -p kernel ml::"
        working-directory: kernel
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        run: "cargo +nightly miri test -p kernel --lib --target x86_64-unknown-linux-gnu ml::"

      # Component model (docs/specs/2026-09-18-component-model-design.md §15,
      # "pure code first"): `hash::` (SHA-256 + framed ids), `host::` (envelope
      # codec, inbox ring, native runtime, the host itself), and since PR-2
      # `cap::` (capability tables, lattice, denial log) and `bus::` (attested
      # send/request/reply/delegate/revoke on local host cells) are small pure
      # `no_std` suites — 75 tests, ~73 s of test run under Miri locally (the
      # cap property test drops to 200 steps under `cfg(miri)`, and the
      # production-size 256-deep revocation chain — 19 s under Miri, safe code
      # only — runs natively only). Same scoping rule as above.
      - name: "cargo +nightly miri test -p kernel hash:: host:: cap:: bus::"
        working-directory: kernel
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        run: "cargo +nightly miri test -p kernel --lib --target x86_64-unknown-linux-gnu -- hash:: host:: cap:: bus::"

  # GATING — promoted from experimental on 2026-07-24, per the original promotion
  # plan: three consecutive real CI runs discharged every hal harness (apic/cpuid/
  # ata decode, plus simd's VNNI bias-correction proofs). A failure or timeout
  # here now blocks merge, exactly like Miri.
  #
  # Runtime note: this job used to take 14-21 min, of which 93% was ONE harness
  # (`vnni_bias_correction_is_exact`, a 4-lane multiplier equivalence) whose SAT
  # solve swung ±50% run to run. Splitting it into a one-lane base case + an
  # inductive step (see hal::simd::proofs) cut that to ~47 s and made the runtime
  # stable — which is what makes gating on this job safe. Keep it that way: a
  # harness that bit-blasts several simultaneous multipliers does not belong in a
  # gating job. Measure before adding one (`cargo kani -p hal --harness NAME`).
  #
  # `--ignore-global-asm` is REQUIRED: hal's context.rs defines the context-switch
  # primitive in `global_asm!`, which Kani cannot model — without the flag it
  # refuses to compile the crate at all. The harnesses verify pure decode/
  # arithmetic logic, not the asm, so ignoring it does not weaken these proofs.
  #
  # A job-level timeout is fine on a GATING job: `cancelled` and `failure` both
  # hold the gate. That equivalence is why both Kani jobs can now carry a plain
  # job-level cap; it did NOT hold while either was non-gating, because
  # `continue-on-error` neutralizes a failure but not a cancellation (proven by
  # runs 30108091090 / 30116133334). Re-read that history before ever adding
  # `continue-on-error` back to a job that has a job-level timeout.
  kani-hal:
    name: Kani (hal proofs)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable toolchain (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy,llvm-tools
          targets: x86_64-unknown-none
      - name: Install kani-verifier
        run: cargo install --locked kani-verifier
      - name: cargo kani setup
        run: cargo kani setup
      - name: cargo kani -p hal
        working-directory: kernel
        run: cargo kani -p hal -Z unstable-options --ignore-global-asm

  # GATING — promoted from experimental on 2026-07-26, meeting the condition this
  # comment used to state ("once a real CI run discharges every kernel harness
  # inside the step cap"). Five consecutive real CI runs did, at job level:
  # e985494, 31214ab, 764dbd3, f6d1cfb, and main @ 74af523 — 6/6 harnesses in
  # ~55-105 s, zero failures. A failure or timeout here now blocks merge.
  #
  # Getting here took removing two intractable harnesses, both of which had been
  # merged without ever being discharged: `cargo kani -p kernel` previously never
  # terminated at all, and two uncapped runs died at GitHub's 6 h job ceiling
  # after 5 h 38 min / 5 h 41 min (2026-07-24). The causes were a symbolic 64x64
  # multiplier equivalence in `ml`, and `VecDeque`'s heap model swamping the
  # `sched` Invariant #4 proof. Both were fixed by changing what is proven, not
  # by weakening it — see `kernel::ml::proofs` and `kernel::sched::proofs`.
  #
  # The lesson worth keeping: Kani runs fine locally (`cargo kani -p kernel
  # -Z unstable-options --ignore-global-asm`, ~60 s for the whole suite). A
  # harness that has never been discharged locally does not belong in this
  # gating job. Measure before adding one.
  #
  # The step-level cap stays as a hang backstop. It is now redundant with the
  # job-level cap for gate purposes (a gating job holds the gate whether it ends
  # `failure` or `cancelled`), but it fails FAST and points at the exact step,
  # which is worth keeping.
  kani-kernel:
    name: Kani (kernel proofs)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable toolchain (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy,llvm-tools
          targets: x86_64-unknown-none
      - name: Install kani-verifier
        run: cargo install --locked kani-verifier
      - name: cargo kani setup
        run: cargo kani setup
      # `--ignore-global-asm`: same requirement as kani-hal — `-p kernel` inherits
      # hal's `global_asm!` through its dependency on the hal crate.
      - name: cargo kani -p kernel
        working-directory: kernel
        timeout-minutes: 30
        run: cargo kani -p kernel -Z unstable-options --ignore-global-asm
