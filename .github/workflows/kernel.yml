name: Kernel CI

# Trigger on changes to kernel source or this workflow file.
on:
  # Scoped to main: an unscoped `push:` also fires on PR branches, duplicating
  # every PR's run (the `push` and `pull_request` events have different
  # `github.ref` values, so the concurrency group below does not dedupe them).
  push:
    branches: [main]
    paths:
      - "kernel/**"
      - ".github/workflows/kernel.yml"
  pull_request:
    paths:
      - "kernel/**"
      - ".github/workflows/kernel.yml"

# Cancel in-progress runs for the same ref so redundant pushes don't pile up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Limine tag pinned to match kernel/limine (branch v11.x-binary, tag v11.4.1).
  LIMINE_TAG: v11.4.1-binary
  LIMINE_REPO: https://github.com/limine-bootloader/limine.git

jobs:
  kernel-ci:
    name: Build · Lint · Boot-test
    runs-on: ubuntu-latest
    # No job here should ever approach this: the whole build+lint+boot pipeline
    # runs in ~2 min. The cap exists because GitHub's default is 6 HOURS, and a
    # hung QEMU boot test does not fail — it sits there looking busy. That is not
    # hypothetical: two `cargo kani -p kernel` runs burned 5 h 38 min and
    # 5 h 41 min each against that default before anyone could tell they were
    # never going to finish (2026-07-24). Every job in this repo gets a cap.
    timeout-minutes: 20

    steps:
      # ── 1. Source ──────────────────────────────────────────────────────────
      - name: Checkout SentinelOS
        uses: actions/checkout@v4

      # ── 2. Rust toolchain ─────────────────────────────────────────────────
      # rust-toolchain.toml (stable, rustfmt + clippy + llvm-tools,
      # target x86_64-unknown-none) is honoured automatically by dtolnay/rust-toolchain.
      - name: Install Rust stable toolchain (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          # Duplicate what rust-toolchain.toml declares so the action pins
          # exactly the same set without requiring nightly.
          components: rustfmt,clippy,llvm-tools
          targets: x86_64-unknown-none

      # ── 3. Cargo cache ────────────────────────────────────────────────────
      - name: Cache Cargo registry + build artefacts
        uses: actions/cache@v4
        with:
          # Disk images never ride in the cache. actions/cache archives
          # `kernel/target` as ONE directory entry, so a `!` path cannot exclude
          # a file inside it; this job's last step deletes the images instead,
          # before the post-job save. (The boot tests also recreate their own
          # image every run; the dev image is `make run`'s.)
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            kernel/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('kernel/Cargo.lock', 'kernel/xtask/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # ── 4. System dependencies ────────────────────────────────────────────
      # `apt-get update` first: the runner image ships a stale package index, so
      # a bare `install` can 404 on a superseded transitive dependency (observed
      # with `ovmf`, pulled in by qemu-system-x86).
      - name: Install QEMU and xorriso
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 xorriso

      # ── 5. Limine (pinned to tag v11.4.1-binary on branch v11.x-binary) ──
      # Clone the exact tag so we get the pre-built BIOS/EFI binaries and the
      # host `limine` tool source, then build the host tool.
      - name: Clone Limine ${{ env.LIMINE_TAG }}
        run: |
          git clone \
            --branch ${{ env.LIMINE_TAG }} \
            --depth 1 \
            ${{ env.LIMINE_REPO }} \
            kernel/limine
          make -C kernel/limine

      # ── 6. Format check ───────────────────────────────────────────────────
      - name: cargo fmt --check
        working-directory: kernel
        run: cargo fmt --all --check

      # ── 7. Clippy (deny warnings) ─────────────────────────────────────────
      - name: cargo clippy
        working-directory: kernel
        run: cargo clippy --target x86_64-unknown-none -- -D warnings

      # ── 8. Build ──────────────────────────────────────────────────────────
      - name: cargo build
        working-directory: kernel
        run: cargo build --target x86_64-unknown-none

      # ── 8b. Host unit tests (differential SIMD harness + ml) ──────────────
      # The primary dynamic coverage for the inline-`asm!` int8-GEMM kernels
      # (hal-tcb SM1/SM2): `hal::simd`'s differential harness diffs each vector
      # kernel bit-for-bit against the scalar reference. These run on the HOST
      # target — they need `std`, which the bare-metal `x86_64-unknown-none`
      # target lacks — so `--target x86_64-unknown-linux-gnu` overrides the
      # workspace's bare-metal `build.target`. `--nocapture` surfaces the
      # per-tier ran/skipped line, so a green run distinguishes "AVX-512 kernel
      # exercised" (avx512f-capable runner) from "skipped" (the common case on
      # stock runners; the AVX2 kernel always runs). `-p kernel` now runs
      # unfiltered: the privileged primitives (`cli`/`sti`, port I/O, …) have
      # host stubs on `not(target_os = "none")`, so the whole kernel host test
      # suite (fs/wm/app included) is host-safe, not just `ml::`.
      - name: cargo test (host differential SIMD + ml)
        working-directory: kernel
        run: |
          cargo test -p hal --target x86_64-unknown-linux-gnu -- --nocapture
          cargo test -p kernel --lib --target x86_64-unknown-linux-gnu -- --nocapture

      # ── 8c. Vector-free-handlers invariant ────────────────────────────────
      # First, unit-test the guard's detection core (that it flags a planted vector
      # instruction — operand, operand-less vzeroupper, opmask — outside hal::simd and
      # allows one inside), so the guard's efficacy is regression-tested, not assumed.
      # Then run it: disassemble the kernel and assert every vector instruction lives
      # in the audited hal::simd module. This machine-checks that no interrupt handler
      # emits vector code, so an IRQ can never clobber an in-flight GEMM — the
      # invariant that lets vector GEMM run interrupts-on (see the vector-state doc).
      - name: xtask guard unit tests + check-no-vector
        working-directory: kernel
        run: |
          cargo test --manifest-path xtask/Cargo.toml \
            --target x86_64-unknown-linux-gnu --target-dir target/xtask
          make check-no-vector

      # ── 8d. One door to the ATA channel ───────────────────────────────────
      # `kernel::blk::ata` holds the IDE channel lock around every `hal::ata`
      # command (the toy FS and the `sfs-commit` task share the disk). Fail the
      # build if any other kernel file names `hal::ata` (comments and strings
      # ignored), so the lock cannot be bypassed by accident.
      - name: check-ata-callers
        working-directory: kernel
        run: make check-ata-callers

      # ── 9. Boot test (deterministic QEMU serial-output check) ─────────────
      # `make test` (host-detecting wrapper over xtask — works on this Linux
      # runner and on macOS) builds the ISO, recreates its own blank test disk
      # (target/sentinelos-test-disk.img), and boots QEMU headless TWICE on it,
      # capturing serial output to target/serial.log and target/serial-boot2.log.
      # Every boot line is asserted on both boots, plus the persistence chain
      # between them (SentinelFS: format → gen 1 → commit gen 2, then mount gen 2
      # with boot 1's superblock hash → commit gen 3; the toy FS: first boot,
      # then PROVEN).
      - name: make test (boot test)
        working-directory: kernel
        run: make test

      # ── 10. Upload serial log on failure ─────────────────────────────────
      - name: Upload serial log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: serial-log
          path: |
            kernel/target/serial.log
            kernel/target/serial-boot2.log
          if-no-files-found: ignore

      # Keep disk images out of the cache: the cache's post-job save runs after
      # this step (see the note on the cache step).
      - name: Drop disk images before the cache save
        if: always()
        run: rm -f kernel/target/sentinelos-disk.img kernel/target/sentinelos-test-disk.img
