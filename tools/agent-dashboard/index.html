<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SentinelOS · Build Team</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #161819;
    --panel:    #121415;
    --line:     #2b2f31;
    --text:     #bcc1c4;
    --dim:      #7a8085;
    --done:     #8aa978;
    --working:  #c2a25e;
    --blocked:  #bf6b6b;
    --idle:     #6d93a8;
    --mono:     'JetBrains Mono', monospace;
    --sans:     'Inter', system-ui, sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 13px;
    line-height: 1.5;
    min-height: 100vh;
    padding: 24px 20px 40px;
  }

  /* ── Header ── */
  .header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 28px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--line);
  }

  .header-left h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--text);
  }

  .header-left .meta {
    margin-top: 4px;
    font-size: 12px;
    color: var(--dim);
    font-family: var(--mono);
  }

  .legend {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: var(--dim);
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* ── Pipeline ── */
  .pipeline-section {
    margin-bottom: 28px;
  }

  .section-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--dim);
    margin-bottom: 10px;
  }

  .section-label .hint {
    font-weight: 400;
    letter-spacing: 0.02em;
    text-transform: none;
    color: var(--line);
    margin-left: 8px;
  }

  .pipeline {
    display: flex;
    align-items: center;
    gap: 0;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 2px;
    overflow-x: auto;
    width: fit-content;
    max-width: 100%;
  }

  .stage {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 500;
    padding: 6px 14px;
    border-radius: 4px;
    color: var(--dim);
    white-space: nowrap;
    transition: background 0.15s;
  }

  .stage.active {
    background: rgba(194, 162, 94, 0.15);
    color: var(--working);
    border: 1px solid rgba(194, 162, 94, 0.3);
  }

  .stage-arrow {
    color: var(--line);
    font-size: 11px;
    padding: 0 2px;
    user-select: none;
  }

  /* ── Agent grid ── */
  .agents-section {
    margin-bottom: 24px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
    align-items: start;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 3px solid var(--idle);
    border-radius: 6px;
    padding: 14px 16px;
    transition: border-color 0.15s;
  }

  .card[data-status="working"]  { border-left-color: var(--working); }
  .card[data-status="done"]     { border-left-color: var(--done); }
  .card[data-status="blocked"]  { border-left-color: var(--blocked); }
  .card[data-status="idle"]     { border-left-color: var(--idle); }

  /* the clickable top region (toggles the flow) */
  .card-top {
    cursor: pointer;
    user-select: none;
  }

  .card-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 6px;
  }

  .agent-name {
    font-weight: 600;
    font-size: 13px;
    color: var(--text);
    font-family: var(--mono);
    letter-spacing: 0.01em;
  }

  .model-badge {
    font-family: var(--mono);
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.08em;
    padding: 2px 6px;
    border-radius: 3px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .model-badge.opus {
    background: rgba(138, 169, 120, 0.12);
    color: var(--done);
    border: 1px solid rgba(138, 169, 120, 0.25);
  }

  .model-badge.sonnet {
    background: rgba(109, 147, 168, 0.12);
    color: var(--idle);
    border: 1px solid rgba(109, 147, 168, 0.25);
  }

  .agent-role {
    font-size: 11px;
    color: var(--dim);
    margin-bottom: 10px;
  }

  .status-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 8px;
  }

  .status-label {
    font-size: 11px;
    font-weight: 500;
  }

  .status-label.working { color: var(--working); }
  .status-label.done    { color: var(--done); }
  .status-label.blocked { color: var(--blocked); }
  .status-label.idle    { color: var(--idle); }

  .dot.working { background: var(--working); }
  .dot.done    { background: var(--done); }
  .dot.blocked { background: var(--blocked); }
  .dot.idle    { background: var(--idle); }

  /* chevron + event count, pushed to the right of the status row */
  .flow-count {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--dim);
  }

  .chev {
    font-size: 10px;
    color: var(--dim);
    transition: transform 0.15s;
    user-select: none;
  }

  .card.expanded .chev { transform: rotate(90deg); }

  .task-line {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--dim);
    border-top: 1px solid var(--line);
    padding-top: 8px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .task-line.active-task {
    color: var(--text);
  }

  /* ── Output flow (expandable) ── */
  .card-flow {
    display: none;
    margin-top: 12px;
    border-top: 1px dashed var(--line);
    padding-top: 10px;
  }

  .card.expanded .card-flow { display: block; }

  .flow-label {
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--dim);
    margin-bottom: 10px;
  }

  .flow-list {
    display: flex;
    flex-direction: column;
    border-left: 1px solid var(--line);
    margin-left: 3px;
  }

  .flow-entry {
    position: relative;
    padding: 5px 0 5px 16px;
    font-family: var(--mono);
    font-size: 10.5px;
    line-height: 1.45;
    color: var(--dim);
    word-break: break-word;
  }

  .flow-entry::before {
    content: '';
    position: absolute;
    left: -3.5px;
    top: 9px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--line);
    box-shadow: 0 0 0 2px var(--panel);
  }

  .flow-entry.working::before { background: var(--working); }
  .flow-entry.done::before    { background: var(--done); }
  .flow-entry.blocked::before { background: var(--blocked); }
  .flow-entry.idle::before    { background: var(--idle); }
  .flow-entry.log::before     { background: var(--dim); }

  .flow-entry.latest { color: var(--text); }
  .flow-entry.latest::before { box-shadow: 0 0 0 2px var(--panel), 0 0 6px currentColor; }

  .flow-ts {
    color: var(--dim);
    margin-right: 8px;
    opacity: 0.85;
  }

  .flow-verb {
    font-weight: 600;
    margin-right: 6px;
  }

  .flow-verb.working { color: var(--working); }
  .flow-verb.done    { color: var(--done); }
  .flow-verb.blocked { color: var(--blocked); }
  .flow-verb.idle    { color: var(--idle); }
  .flow-verb.log     { color: var(--dim); }

  .flow-empty {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--dim);
    padding-left: 4px;
  }

  /* ── Footer ── */
  footer {
    margin-top: 8px;
    font-size: 11px;
    color: var(--dim);
    font-family: var(--mono);
    border-top: 1px solid var(--line);
    padding-top: 14px;
  }

  /* ── Refresh indicator ── */
  .refresh-tick {
    display: inline-block;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--line);
    margin-left: 8px;
    vertical-align: middle;
    transition: background 0.3s;
  }

  .refresh-tick.pulse {
    background: var(--done);
  }
</style>
</head>
<body>

<script>

<header class="header">
  <div class="header-left">
    <h1>SentinelOS &middot; Build Team</h1>
    <div class="meta" id="meta-line">project: SentinelOS &nbsp;|&nbsp; updated: —</div>
  </div>
  <div class="legend">
    <div class="legend-item"><div class="dot done"></div> done / ok</div>
    <div class="legend-item"><div class="dot working"></div> working</div>
    <div class="legend-item"><div class="dot blocked"></div> blocked</div>
    <div class="legend-item"><div class="dot idle"></div> idle</div>
  </div>
</header>

<div class="pipeline-section">
  <div class="section-label">Pipeline</div>
  <div class="pipeline" id="pipeline"></div>
</div>

<div class="agents-section">
  <div class="section-label">Agents <span class="hint">— click a card to expand its output flow</span></div>
  <div class="grid" id="grid"></div>
</div>

<footer>
  live &nbsp;&middot;&nbsp; agents report via tools/agent-dashboard/set-status &nbsp;&middot;&nbsp; polls status.json every 5s
  <span class="refresh-tick" id="tick"></span>
</footer>

<script>
// agent names whose flow is expanded — persisted across the 5s re-renders
const expanded = new Set();

function renderPipeline(stages, activeStage) {
  const el = document.getElementById('pipeline');
  el.innerHTML = '';
  stages.forEach((s, i) => {
    const stage = document.createElement('span');
    stage.className = 'stage' + (s === activeStage ? ' active' : '');
    stage.textContent = s;
    el.appendChild(stage);
    if (i < stages.length - 1) {
      const arrow = document.createElement('span');
      arrow.className = 'stage-arrow';
      arrow.textContent = '›';
      el.appendChild(arrow);
    }
  });
}

function fmtTime(ts) {
  // "2026-06-04T10:42:13" → "10:42:13"; tolerate empty/date-only
  if (!ts) return '';
  const parts = String(ts).split('T');
  return (parts[1] || parts[0] || '').slice(0, 8);
}

function flowHtml(a) {
  let hist = Array.isArray(a.history) ? a.history.slice() : [];
  if (hist.length === 0) {
    // synthesize a "current" entry so an expanded card is never empty
    hist = [{ ts: a._ts || '', kind: 'status', status: a.status, task: a.task }];
  }
  const rows = hist.map((e, i) => {
    const isLog = e.kind === 'log';
    const cls = isLog ? 'log' : (e.status || 'idle');
    const verb = isLog ? 'log' : (e.status || '');
    const latest = (i === hist.length - 1) ? ' latest' : '';
    const ts = fmtTime(e.ts);
    return `<div class="flow-entry ${cls}${latest}">`
      + (ts ? `<span class="flow-ts">${escHtml(ts)}</span>` : '')
      + `<span class="flow-verb ${cls}">${escHtml(verb)}</span>`
      + `<span class="flow-task">${escHtml(e.task || '—')}</span>`
      + `</div>`;
  }).join('');
  const n = hist.length;
  return `<div class="card-flow">
    <div class="flow-label">output flow</div>
    <div class="flow-list">${rows}</div>
  </div>`;
}

function renderAgents(agents) {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  agents.forEach(a => {
    const card = document.createElement('div');
    card.className = 'card' + (expanded.has(a.name) ? ' expanded' : '');
    card.dataset.status = a.status;
    card.dataset.name = a.name;

    const isActive = a.status === 'working';
    const statusClass = a.status;
    const histLen = Array.isArray(a.history) ? a.history.length : 0;
    const countLabel = histLen > 0 ? `${histLen} event${histLen === 1 ? '' : 's'}` : 'flow';

    card.innerHTML = `
      <div class="card-top">
        <div class="card-header">
          <span class="agent-name">${escHtml(a.name)}</span>
          <span class="model-badge ${a.model.toLowerCase()}">${a.model.toUpperCase()}</span>
        </div>
        <div class="agent-role">${escHtml(a.role)}</div>
        <div class="status-row">
          <div class="dot ${statusClass}"></div>
          <span class="status-label ${statusClass}">${escHtml(a.status)}</span>
          <span class="flow-count">${escHtml(countLabel)}</span>
          <span class="chev">▸</span>
        </div>
        <div class="task-line${isActive ? ' active-task' : ''}">${escHtml(a.task)}</div>
      </div>
      ${flowHtml(a)}
    `;

    card.querySelector('.card-top').addEventListener('click', () => {
      if (expanded.has(a.name)) expanded.delete(a.name);
      else expanded.add(a.name);
      card.classList.toggle('expanded');
    });

    grid.appendChild(card);
  });
}

function renderMeta(project, updated, updatedAt) {
  const stamp = updatedAt ? updatedAt.replace('T', ' ') : updated;
  document.getElementById('meta-line').textContent =
    `project: ${project}  |  updated: ${stamp || '—'}`;
}

function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function render(data) {
  renderMeta(data.project, data.updated, data.updatedAt);
  renderPipeline(data.pipeline, data.activeStage);
  renderAgents(data.agents);
}

function pulseTick() {
  const t = document.getElementById('tick');
  t.classList.add('pulse');
  setTimeout(() => t.classList.remove('pulse'), 500);
}

async function load() {
  try {
    const r = await fetch('status.json?_=' + Date.now());
    if (!r.ok) throw new Error('non-ok');
    const data = await r.json();
    render(data);
    pulseTick();
  } catch (_) {
    render(FALLBACK_DATA);
  }
}

// Initial load + poll every 5s
load();
setInterval(load, 5000);
</script>
</body>
</html>
