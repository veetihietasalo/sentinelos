# This file previously overrode [build] target to "aarch64-apple-darwin" to
# counteract the workspace-wide build.target = "x86_64-unknown-none" that was set
# in kernel/.cargo/config.toml.
#
# That global default has been removed: kernel/.cargo/config.toml no longer sets
# build.target at all, so there is nothing to override here.  xtask now builds for
# the host triple automatically on every platform (x86_64-unknown-linux-gnu on
# Linux CI, aarch64-apple-darwin on M-series Mac, etc.).
#
# This file is kept as documentation of the old arrangement; it is intentionally
# empty of any [build] table.
