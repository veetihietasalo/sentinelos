# Host target for building xtask DIRECTLY from this directory
# (`cd kernel/xtask && cargo build`).
#
# Cargo reads .cargo/config.toml from the current working directory upward, NOT
# from the built manifest's directory. A build launched from kernel/ therefore
# picks up kernel/.cargo/config.toml (build.target = "x86_64-unknown-none") and
# would try to cross-compile xtask to a std-less bare-metal target. This file
# overrides that back to a host triple for builds invoked from *inside* xtask/.
#
# NOTE: `make …` and the `cargo xtask` alias do NOT consult this file — both run
# from kernel/ and pass an explicit --target (the Makefile detects the host with
# `rustc -vV`; the alias hard-codes it). This value only matters for a direct
# in-directory build, so set it to your host (aarch64-apple-darwin by default;
# e.g. x86_64-unknown-linux-gnu on Linux).
[build]
target = "aarch64-apple-darwin"
