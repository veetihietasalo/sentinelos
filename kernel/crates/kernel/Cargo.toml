[package]
name = "kernel"
version = "0.1.0"
edition = "2021"

# Library crate: the safe kernel logic. The bootable binary is `crates/boot`,
# which links this in and provides the `_start` entry shim + panic handler.

[dependencies]
hal = { path = "../hal" }
ui = { path = "../ui" }

# `cfg(kani)` gates the in-tree proof harnesses (e.g. `ml`'s tier-selection
# proof). Declare it so `-D warnings` does not flag the cfg as unexpected on a
# normal (non-Kani) build, matching the `hal` crate's configuration.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
