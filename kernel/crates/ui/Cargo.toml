[package]
name = "ui"
version = "0.1.0"
edition = "2021"

# SentinelOS's first graphics: the "Cyber Dusk" boot screen. A safe, no_std 2D
# raster + bitmap-font library that draws ONLY through the bounds-checked
# `hal::framebuffer` API — hence `#![forbid(unsafe_code)]`.

[lib]
name = "ui"

[dependencies]
hal = { path = "../hal" }
