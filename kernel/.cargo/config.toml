[build]
target = "x86_64-unknown-none"

[target.x86_64-unknown-none]
rustflags = [
    "-C", "linker=rust-lld",
    "-C", "link-arg=-Tlinker.ld",
    "-C", "link-arg=-no-pie",
    "-C", "relocation-model=static",
    # The kernel is linked into the top 2 GiB (0xFFFFFFFF80000000); the "kernel"
    # code model is the semantically-correct model for a higher-half kernel
    # (direct sign-extended 32-bit symbol references). Some library paths still
    # emit a GOT-indirect `memcpy` call (e.g. `<[T]>::to_vec`, used by
    # `String::from`); those GOT slots are resolved to absolute addresses at LINK
    # time by our non-PIE static link and are KEPT by `linker.ld` (see its `.got`
    # section). Earlier the script discarded `.got`, leaving the GOT at address 0,
    # so a GOT-indirect load read near-null and #PF'd (CR2≈0x18) the first time the
    # shell allocated a `String`.
    "-C", "code-model=kernel",
]

[alias]
# macOS-only convenience shortcut for the xtask host driver. The explicit
# --target pins xtask to this host so it is NOT cross-compiled to the bare-metal
# `build.target = "x86_64-unknown-none"` set above (which ships no std). xtask
# lives in its own standalone workspace (kernel/xtask/Cargo.toml has [workspace]).
#
# A cargo alias cannot expand the host triple, so this hard-codes it — meaning
# `cargo xtask` only works on aarch64-apple-darwin. For a PORTABLE runner that
# works on Linux (CI / Claude Code on the web) and macOS alike, use the Makefile:
#   make build | make run | make test | make screenshot
# Because the --target here is explicit, CARGO_BUILD_TARGET does NOT override it;
# the Makefile instead passes the detected host (`rustc -vV`) as --target.
xtask = "run --manifest-path xtask/Cargo.toml --target aarch64-apple-darwin --target-dir target/xtask --"
