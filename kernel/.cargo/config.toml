# NOTE: There is intentionally NO global [build] target here.
#
# Removing build.target = "x86_64-unknown-none" lets `cargo xtask` compile the
# host-side driver for whatever host triple is running (x86_64-unknown-linux-gnu
# on CI/Linux, aarch64-apple-darwin on an M-series Mac, etc.) without any
# per-host hand-editing.
#
# The kernel itself is always cross-compiled to x86_64-unknown-none:
#   * xtask/src/main.rs calls `cargo build --target x86_64-unknown-none` explicitly.
#   * CI steps `cargo clippy` and `cargo build` both pass `--target x86_64-unknown-none`.
#   * A bare `cargo build` in kernel/ (without --target) now builds for the host;
#     use `cargo xtask build` or pass --target explicitly for the kernel ELF.
#
# The [target.x86_64-unknown-none] rustflags block below is untouched — it only
# activates when that specific target is requested, so host builds are unaffected.

[target.x86_64-unknown-none]
rustflags = [
    "-C", "linker=rust-lld",
    "-C", "link-arg=-Tlinker.ld",
    "-C", "link-arg=-no-pie",
    "-C", "relocation-model=static",
    # The kernel is linked into the top 2 GiB (0xFFFFFFFF80000000); the "kernel"
    # code model is the semantically-correct model for a higher-half kernel
    # (direct sign-extended 32-bit symbol references). Some library paths still
    # emit a GOT-indirect `memcpy` call (e.g. `<[T]>::to_vec`, used by
    # `String::from`); those GOT slots are resolved to absolute addresses at LINK
    # time by our non-PIE static link and are KEPT by `linker.ld` (see its `.got`
    # section). Earlier the script discarded `.got`, leaving the GOT at address 0,
    # so a GOT-indirect load read near-null and #PF'd (CR2≈0x18) the first time the
    # shell allocated a `String`.
    "-C", "code-model=kernel",
]

[alias]
# Build the xtask host binary and forward remaining args to it.
#
# No --target flag here: Cargo picks the host triple automatically
# (x86_64-unknown-linux-gnu on CI/Linux, aarch64-apple-darwin on M-series Mac).
# This works because we removed the global build.target above, so there is no
# bare-metal default to override.
#
# xtask lives in its own standalone workspace (kernel/xtask/Cargo.toml has [workspace])
# so it does not share kernel workspace deps or profiles.
xtask = "run --manifest-path xtask/Cargo.toml --target-dir target/xtask --"
